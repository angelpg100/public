<title>Área VIP · Prototipo app</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Diseño: la marca actual del Área VIP (crema + oro + negro), llevada a estructura de app:
   menú lateral oscuro en ordenador, barra inferior en móvil, cada día con pestañas. Un solo look (claro), como la página real. */
:root{
  color-scheme:light;
  --bg:#F7F3EC; --card:#FFFDF9; --line:#E6DCCB; --soft:#F1E9DC; --ink:#141414; --ink2:#2E2B27; --muted:#6A635B;
  --gold:#C9974A; --gold-hi:#D9A564; --gold-text:#8A6420; --dark:#111111; --dark2:#1C1A17; --dark-line:#2C2924; --on-dark:#EDE6DA; --on-dark-mute:#A39A8D;
  --ok:#1E6B3A; --ok-bg:#E6F2EA; --live:#C2372B;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif; --label:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#E9E3D8;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img{max-width:100%;display:block}
.lab{font-family:var(--label);letter-spacing:.06em;text-transform:uppercase;font-size:15px;line-height:1.1}
.d{background:linear-gradient(transparent 60%,#F3DDB5 60%)}

/* ---------- barra de prototipo (solo para decidir) ---------- */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#2A2723;color:#F2D29A;font-size:13px;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#2A2723}
.proto b{color:#fff;font-weight:600}
.seg{display:inline-flex;border:1px solid #57503F;border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;padding:4px 12px;color:#E8D9BC;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--gold);color:#141414;font-weight:600}
.proto .grp{display:flex;gap:8px;align-items:center}

/* ---------- escenario ---------- */
.stage{padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center}
.device{width:100%;max-width:1280px;background:var(--bg);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px -30px rgba(40,30,10,.45);container-type:inline-size;container-name:app}
.stage.phone .device{max-width:390px;border-radius:36px;border:10px solid #1A1916;height:min(844px,calc(100vh - 120px));overflow:auto}
@media (max-width:700px){ .stage{padding:0} .device{border-radius:0;box-shadow:none} .stage.phone .device{border:0;border-radius:0;height:auto;max-width:none} .proto .hide-sm{display:none} }

/* ---------- app ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:760px}
.side{background:var(--dark);color:var(--on-dark);padding:22px 14px;display:flex;flex-direction:column;gap:18px}
.side .logo{padding:2px 10px 0}
.side .logo img{width:150px}
.side .logo small{display:block;margin-top:6px;color:var(--gold-hi)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .h{color:var(--on-dark-mute);padding:10px 10px 4px}
.ni{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:9px 10px;color:var(--on-dark)}
.ni:hover{background:var(--dark2)}
.ni[aria-current="page"]{background:#2A2418;color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.ni .ic{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--dark2);font-size:13px;color:var(--gold-hi)}
.ni .t{min-width:0;flex:1}
.ni .t b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .t span{display:block;font-size:12px;color:var(--on-dark-mute)}
.ni .st{font-size:12px;flex:none}
.st-ok{color:#8BD1A2}.st-hoy{color:#fff;background:var(--live);border-radius:999px;padding:1px 8px;font-weight:600}.st-lock{color:var(--on-dark-mute)}
.mini{height:3px;border-radius:3px;background:var(--dark-line);margin-top:6px;overflow:hidden}.mini i{display:block;height:100%;background:var(--gold)}
.ni.locked .t b{color:var(--on-dark-mute)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px;border:1px solid transparent;text-decoration:none}
.btn-gold{background:var(--gold);color:#141414}
.btn-gold:hover{background:var(--gold-hi)}
.btn-dark{background:var(--ink);color:#fff}
.btn-line{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-wa{background:#1F7A4D;color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.side .btn{width:100%;font-size:14px;padding:10px 14px}
.side .btn-line{border-color:var(--dark-line);color:var(--on-dark)}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 32px;border-bottom:1px solid var(--line);background:var(--card)}
.crumb{color:var(--muted);font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.who{display:flex;align-items:center;gap:10px;font-size:14px;flex:none}
.av{width:34px;height:34px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-weight:700;color:#141414}
.content{padding:28px 32px 48px;display:flex;flex-direction:column;gap:24px;max-width:1040px;width:100%}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-weight:400;font-size:34px;line-height:1.1;letter-spacing:-.015em}
h1 b,h2 b{font-weight:700}
h2{font-weight:400;font-size:24px;line-height:1.15}
h3{font-weight:600;font-size:18px;line-height:1.3}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.eyebrow{color:var(--gold-text)}

/* hoy */
.today{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--dark);color:var(--on-dark);border-radius:18px;overflow:hidden}
.today .th{position:relative;min-height:220px;background:#000}
.today .th img{width:100%;height:100%;object-fit:cover}
.today .bd{padding:24px;display:flex;flex-direction:column;gap:12px}
.today h2{color:#fff}
.sched{display:flex;flex-direction:column;gap:8px;margin:4px 0}
.sched div{display:flex;gap:12px;align-items:baseline;font-size:15px}
.sched .hr{font-family:var(--label);font-size:22px;color:var(--gold-hi);min-width:58px;letter-spacing:.03em}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.pill-live{background:var(--live);color:#fff}
.pill-ok{background:var(--ok-bg);color:var(--ok)}
.pill-soft{background:var(--soft);color:var(--gold-text)}
.pill-lock{background:#ECE6DC;color:var(--muted)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.cont{display:flex;gap:16px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.cont:hover{border-color:var(--gold)}
.cont img{width:120px;border-radius:10px;flex:none}
.cont .t{min-width:0}
.cont .t b{display:block;font-weight:600}
.bar{height:8px;border-radius:8px;background:#EDE5D8;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:8px}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.wk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.wk:hover{border-color:var(--gold)}
.wk .im{position:relative}
.wk.locked .im img{filter:grayscale(.85) brightness(.75)}
.wk .lk{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:22px}
.wk .cp{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.wk .cp b{font-weight:600;font-size:14px;line-height:1.3}
.pend{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* día */
.dayhead{display:flex;gap:20px;align-items:center}
.dayhead img{width:180px;border-radius:12px;flex:none}
.dayhead .t{min-width:0;display:flex;flex-direction:column;gap:8px;flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;padding:12px 14px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;flex:none}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.tab .n{font-size:12px;color:var(--gold-text);margin-left:4px}
.player{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:radial-gradient(120% 120% at 20% 20%,#2D2618,#0E0D0B);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:22px}
.screen .play{position:absolute;right:22px;top:50%;transform:translateY(-50%);width:64px;height:64px;border-radius:50%;background:var(--gold);display:grid;place-items:center;border:0}
.screen .play svg{width:24px;height:24px;margin-left:4px}
.screen h3{color:#fff;font-size:22px;max-width:75%}
.screen .lab{color:var(--gold-hi)}
.screen .note{position:absolute;left:22px;top:18px;font-size:12px;color:#BFB4A2}
.chap{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto;padding-right:4px}
.ch{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.ch:hover{border-color:var(--gold)}
.ch[aria-current="true"]{border-color:var(--gold);background:#FBF3E4}
.ch .ck{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;border:1.5px solid var(--line);color:var(--muted)}
.ch.seen .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.ch[aria-current="true"] .ck{background:var(--ink);border-color:var(--ink);color:var(--gold-hi)}
.ch .t{min-width:0;flex:1;font-size:14px;line-height:1.35}
.ch .t span{display:block;font-family:var(--label);letter-spacing:.05em;font-size:13px;color:var(--gold-text)}
.ch .du{font-size:12.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.chap-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.audio{display:flex;gap:16px;align-items:center;background:var(--dark);color:var(--on-dark);border-radius:14px;padding:16px 18px}
.audio .pb{width:52px;height:52px;border-radius:50%;background:var(--gold);border:0;display:grid;place-items:center;flex:none}
.audio .pb svg{width:20px;height:20px;margin-left:3px}
.audio .w{flex:1;min-width:0}
.audio .wave{height:28px;display:flex;align-items:center;gap:2px;margin-top:6px}
.audio .wave i{flex:1;background:#4A4336;border-radius:2px}
.audio .wave i.on{background:var(--gold)}
.ideas{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none;counter-reset:i}
.ideas li{position:relative;padding-left:44px;counter-increment:i}
.ideas li::before{content:counter(i);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--gold-text);display:grid;place-items:center;font-weight:700;font-size:14px}
.notes{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.notes li{border-left:3px solid var(--gold);padding:2px 0 2px 14px}
.subseg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px}
.subseg button{border:0;background:transparent;border-radius:999px;padding:6px 16px;font-size:14px;font-weight:500;color:var(--muted)}
.subseg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.q{display:flex;flex-direction:column;gap:14px}
.q .opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.opt:hover{border-color:var(--gold)}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:#C9584C;background:#FBEAE7}
.qbar{display:flex;gap:6px}.qbar i{flex:1;height:6px;border-radius:6px;background:#EDE5D8}.qbar i.done{background:var(--gold)}
.why{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:15px}
.dl{display:flex;flex-direction:column;gap:8px}
.dli{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:inherit}
.dli:hover{border-color:var(--gold)}
.dli .k{font-family:var(--label);letter-spacing:.05em;color:var(--gold-text);flex:none}
.check{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--gold);margin-top:2px;flex:none}
.lockbox{text-align:center;padding:48px 24px;display:flex;flex-direction:column;gap:12px;align-items:center}
.lockbox .big{font-size:42px}
.ex{font-size:12px;color:var(--muted);font-style:italic}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}

/* barra inferior (móvil) */
.bnav{display:none}
.daychips{display:none}

/* ---------- móvil: el contenedor manda, no la pantalla ---------- */
@container app (max-width: 860px){
  .app{grid-template-columns:1fr;min-height:0}
  .side{display:none}
  .top{padding:12px 16px;position:sticky;top:0;z-index:5}
  .top .who span{display:none}
  .content{padding:18px 16px 96px;gap:20px}
  h1{font-size:28px}
  .today{grid-template-columns:1fr}
  .today .th{min-height:0;aspect-ratio:16/9}
  .row2,.grid2,.player{grid-template-columns:1fr}
  .week{grid-template-columns:repeat(5,minmax(132px,1fr));overflow-x:auto;padding-bottom:6px}
  .dayhead img{width:104px}
  .dayhead h1{font-size:22px}
  .chap{max-height:none}
  .screen h3{font-size:18px}
  .cont img{width:92px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:sticky;bottom:0;background:var(--dark);border-top:1px solid var(--dark-line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6;margin-top:auto}
  .bnav button{background:transparent;border:0;color:var(--on-dark-mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 0}
  .bnav button .ic{font-size:18px;line-height:1}
  .bnav button[aria-current="page"]{color:var(--gold-hi)}
  .daychips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-4px 0 0}
  .daychips::-webkit-scrollbar{display:none}
  .dc{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
  .dc[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .dc.locked{color:var(--muted)}
}
@media (prefers-reduced-motion:no-preference){ .ch,.wk,.cont,.opt{transition:border-color .15s,background .15s} }
</style>

<div class="proto" role="region" aria-label="Controles del prototipo">
  <span><b>Prototipo</b> · Área VIP como app · contenido real de los Días 1 y 2 · progreso simulado</span>
  <span class="grp hide-sm">Ver en <span class="seg" id="seg-dev"><button data-v="pc" aria-pressed="true">Ordenador</button><button data-v="phone" aria-pressed="false">Móvil</button></span></span>
  <span class="grp">Al entrar <span class="seg" id="seg-entry"><button data-v="inicio" aria-pressed="true">Inicio con «Hoy»</button><button data-v="dia" aria-pressed="false">Directo al día</button></span></span>
  <span class="grp">Días futuros <span class="seg" id="seg-fut"><button data-v="lock" aria-pressed="true">Con candado</button><button data-v="hide" aria-pressed="false">Ocultos</button></span></span>
</div>

<div class="stage" id="stage"><div class="device"><div class="app" id="app"></div></div></div>

<script>
const DATA=/*__DATA__*/null;
const TH=/*__THUMBS__*/null;
const LOGO=/*__LOGO__*/'';
const TODAY=3;               /* simulamos el miércoles 18 por la mañana */
const ST={view:'inicio',day:3,tab:'clase',rep:'clase',test:'clase',vid:{},seen:{},quiz:{},entry:'inicio',fut:'lock',check:{},tests:{estilo:true,inversor:false}};
/* progreso de ejemplo: Día 1 completo, Día 2 a medias */
(function(){ const k1=DATA.kit[1]; ['clase','vip'].forEach(s=>k1[s].videos.forEach((_,i)=>ST.seen['1-'+s+'-'+i]=1)); ST.quiz['1-clase']={i:k1.clase.quiz.length,score:5,done:true}; ST.quiz['1-vip']={i:k1.vip.quiz.length,score:4,done:true};
  [0,1,2,3].forEach(i=>ST.seen['2-clase-'+i]=1); ST.vid['2-clase']=4; })();

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* candado ilustrado, de línea: sustituye al emoji */
const LOCK=(s=16)=>`<svg class="lock" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7.5 10.5V8a4.5 4.5 0 0 1 9 0v2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="4.5" y="10.5" width="15" height="10.5" rx="3" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="15.2" r="1.5" fill="currentColor"/><path d="M12 16.5v1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const LOCK_BIG=()=>`<svg class="lock-ill" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56" fill="#F1E9DC"/><circle cx="60" cy="60" r="44" fill="none" stroke="#E6DCCB" stroke-width="1.5" stroke-dasharray="3 5"/><path d="M45 55V46a15 15 0 0 1 30 0v9" fill="none" stroke="#141414" stroke-width="4" stroke-linecap="round"/><rect x="36" y="54" width="48" height="36" rx="9" fill="#C9974A"/><rect x="36" y="54" width="48" height="8" rx="4" fill="#D9A564"/><circle cx="60" cy="71" r="5" fill="#141414"/><path d="M60 74v7" stroke="#141414" stroke-width="4" stroke-linecap="round"/></svg>`;
const TESTS={estilo:{t:'Cómo aprendes',d:'2 minutos · ordena tu contenido',ok:'Activo'},inversor:{t:'Perfil inversor',d:'3 minutos · tu tipo de inversor',ok:'Halcón'}};
const PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z" fill="#141414"/></svg>';
const D=i=>DATA.dias[i], K=i=>DATA.kit[i]||null;
function dayStatus(i){ return i<TODAY?'ok':(i===TODAY?'hoy':'lock'); }
function dayProgress(i){ const k=K(i); if(!k) return {seen:0,total:0,tests:0,ntests:0,pct:0};
  let seen=0,total=0,tests=0,nt=0; ['clase','vip'].forEach(s=>{ if(!k[s]) return; (k[s].videos||[]).forEach((_,j)=>{total++; if(ST.seen[i+'-'+s+'-'+j]) seen++;}); if((k[s].quiz||[]).length){nt++; if(ST.quiz[i+'-'+s]&&ST.quiz[i+'-'+s].done) tests++;} });
  const pct=Math.round(100*(seen+tests*3)/Math.max(1,total+nt*3)); return {seen,total,tests,ntests:nt,pct}; }
function visibleDays(){ const n=[1,2,3,4,5]; return ST.fut==='hide'?n.filter(i=>i<=TODAY):n; }
function go(view,day,tab){ ST.view=view; if(day) ST.day=day; if(tab) ST.tab=tab; render(); const d=document.querySelector('.device'); if(d) d.scrollTop=0; window.scrollTo(0,0); }

/* ---------- menú lateral ---------- */
function side(){
  let h=`<aside class="side"><div class="logo"><img src="${LOGO}" alt="MetaPro"><small class="lab">Área VIP · Finanzas Pro</small></div><nav class="nav" aria-label="Área VIP">`;
  h+=ni('inicio',0,'⌂','Inicio','Tu semana de un vistazo','');
  h+=`<div class="h lab">Tu semana</div>`;

function vAdmision(){ return `<div class="today" style="grid-template-columns:1fr"><div class="bd" style="padding:32px"><div class="lab" style="color:var(--gold-hi)">Siguiente paso</div><h2 style="color:#fff">Proceso de admisión <b>a la academia</b></h2><p style="margin:0">Si quieres seguir formándote con nosotros, solicita tu plaza. Revisaremos tu caso contigo.</p><button class="btn btn-gold" style="align-self:flex-start">Solicitar mi plaza</button></div></div>`; }

function bnav(){ const it=[['inicio','⌂','Inicio'],['semana','▦','Semana'],['recursos','⇩','Recursos'],['brain','✦','Brain'],['perfil','◉','Perfil']];
  const cur= ST.view==='dia'?'semana':ST.view;
  return `<nav class="bnav" aria-label="Menú">${it.map(([v,ic,t])=>`<button ${cur===v?'aria-current="page"':''} onclick="go('${v}')"><span class="ic">${ic}</span>${t}</button>`).join('')}</nav>`; }

function render(){
  const v=ST.view; const body = v==='dia'?vDia(): v==='recursos'?vRecursos(): v==='brain'?vBrain(): v==='perfil'?vPerfil(): v==='semana'?vSemana(): v==='admision'?vAdmision(): vInicio();
  document.getElementById('app').innerHTML = side() + `<div class="main">${topBar()}<div class="content">${body}</div>${bnav()}</div>`;
}
function seg(id,fn){ const el=document.getElementById(id); el.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); fn(b.dataset.v); }); }
seg('seg-dev',v=>{ document.getElementById('stage').classList.toggle('phone',v==='phone'); });
seg('seg-entry',v=>{ ST.entry=v; if(v==='dia') go('dia',TODAY,'clase'); else go('inicio'); });
seg('seg-fut',v=>{ ST.fut=v; if(v==='hide'&&ST.view==='dia'&&ST.day>TODAY) ST.day=TODAY; render(); });
render();
</script>
